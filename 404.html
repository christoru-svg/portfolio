<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page introuvable — Christopher De Paola</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/saas/monogram.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <script>
    (function () {
      var t; try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root { --bg: #0e0e14; --surface: #16161f; --line: #2a2a3a; --fg: #ececf3; --muted: #9a9ab0; --accent: #a99cff; --accent-ink: #14112b; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f7f6fb; --surface: #ffffff; --line: #e1deee; --fg: #17151f; --muted: #605c74; --accent: #5b47e0; --accent-ink: #ffffff; color-scheme: light; } }
    :root[data-theme="light"] { --bg: #f7f6fb; --surface: #ffffff; --line: #e1deee; --fg: #17151f; --muted: #605c74; --accent: #5b47e0; --accent-ink: #ffffff; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.6 "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
    main { width: min(560px, 100%); display: grid; gap: 18px; justify-items: start; }
    .cat { width: 120px; height: 120px; transform: rotate(-8deg); }
    .code { font: 500 13px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--accent); }
    h1 { margin: 0; font: 400 clamp(34px, 7vw, 52px)/1.05 "Instrument Serif", Georgia, serif; text-wrap: balance; }
    p { margin: 0; color: var(--muted); max-width: 52ch; }
    .en { padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a.btn { display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 500; font-size: 15px; }
    a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    a.btn:hover { border-color: var(--accent); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg class="cat" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M7 21c-1.2-1.6-1.6-3.6-1.2-5.6.3-1.6 1.2-3 2.4-4L7.4 5.6c-.1-.5.5-.9.9-.5l2.6 2.6c.7-.2 1.4-.3 2.1-.3s1.4.1 2.1.3l2.6-2.6c.4-.4 1 0 .9.5l-.8 5.8c1.2 1 2.1 2.4 2.4 4 .4 2-.1 4-1.2 5.6z" fill="#f6f1e8" stroke="#3a2f2a" stroke-width="1" stroke-linejoin="round"/>
      <path d="M8.3 5.9l2.6 2.6c-1.4.5-2.6 1.4-3.3 2.6z" fill="#e0893b"/><path d="M17.7 5.9l-2.6 2.6c1.5.5 2.6 1.3 3.3 2.5z" fill="#2c2420"/>
      <path d="M13 15.5c2.4.2 4.6 1.6 5.3 3.8.2.6.1 1.2-.1 1.7H13z" fill="#e0893b"/><path d="M6.8 17.2c.9-.6 2.2-.7 3.1.1.6.6.6 1.6.2 2.5L9 21H7c-.6-1.2-.7-2.6-.2-3.8z" fill="#2c2420"/>
      <circle cx="10.6" cy="13.2" r=".9" fill="#3a2f2a"/><circle cx="15.4" cy="13.2" r=".9" fill="#3a2f2a"/><path d="M12.3 15.2h1.4L13 16z" fill="#c9776f"/>
    </svg>
    <span class="code">ERREUR 404</span>
    <h1>La Gnometta a fait tomber cette page de la table.</h1>
    <p>La page que vous cherchez n'existe pas, ou elle a changé d'adresse.</p>
    <div class="actions">
      <a class="btn primary" href="/">Retour à l'accueil</a>
      <a class="btn" href="/en/" hreflang="en" lang="en">English version</a>
    </div>
    <p class="en" lang="en">La Gnometta knocked this page off the table. The page you're looking for doesn't exist, or it has moved.</p>
  </main>
</body>
</html>
