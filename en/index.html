<style>
/* Layout: a SaaS landing page built like a product. Sticky nav, hero with an app window, then the usual SaaS sections, each mapped to real portfolio content. Dark first. */
:root {
  --bg: #0e0e14;
  --surface: #16161f;
  --surface-2: #1d1d29;
  --line: #2a2a3a;
  --fg: #ececf3;
  --muted: #9a9ab0;
  --accent: #a99cff;
  --accent-ink: #14112b;
  --ok: #5fd39a;
  --warn: #f0c26b;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f6fb; --surface: #ffffff; --surface-2: #f0eef8; --line: #e1deee;
    --fg: #17151f; --muted: #605c74; --accent: #5b47e0; --accent-ink: #ffffff;
    --ok: #1d8a57; --warn: #a06a00; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f6fb; --surface: #ffffff; --surface-2: #f0eef8; --line: #e1deee;
  --fg: #17151f; --muted: #605c74; --accent: #5b47e0; --accent-ink: #ffffff;
  --ok: #1d8a57; --warn: #a06a00; color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body {
  background: var(--bg); color: var(--fg);
  font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
section { padding-block: 88px; border-top: 1px solid var(--line); }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
h2 { font-family: var(--display); font-size: clamp(34px, 4.5vw, 52px); line-height: 1.05; letter-spacing: -0.01em; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); max-width: 60ch; font-size: 17px; }
.head { display: grid; gap: 14px; margin-bottom: 44px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 8px; font-weight: 500; font-size: 15px;
  text-decoration: none; border: 1px solid var(--line); background: var(--surface);
  transition: transform .15s ease, border-color .15s ease;
}
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Nav */
nav.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
nav.top .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 400 18px/1 var(--display); font-style: italic; }
.brand .ver { font: 500 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); padding: 3px 6px; border-radius: 5px; }
.navlinks { display: flex; gap: 22px; margin-left: auto; font-size: 14px; color: var(--muted); }
.navlinks a { text-decoration: none; }
.navlinks a:hover { color: var(--fg); }
@media (max-width: 860px) { .navlinks { display: none; } nav.top .btn { margin-left: auto; } }

/* Hero */
.hero { padding-block: 72px 40px; border-top: 0; }
.announce {
  display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 13px; color: var(--muted); text-decoration: none;
  border: 1px solid var(--line); background: var(--surface); padding: 6px 12px 6px 6px; border-radius: 999px;
}
.announce b { background: var(--accent); color: var(--accent-ink); font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 999px; letter-spacing: .04em; }
.hero h1 {
  font-family: var(--display); font-size: clamp(44px, 7.4vw, 92px); line-height: .98; letter-spacing: -0.02em;
  margin: 28px 0 22px; max-width: 14ch;
}
.hero h1 em { color: var(--accent); }
.hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.hero .fine { margin-top: 14px; font-size: 13px; color: var(--muted); }

/* App window */
.app {
  margin-top: 56px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  overflow: hidden; box-shadow: 0 30px 80px -40px color-mix(in srgb, var(--accent) 45%, transparent);
}
.app-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.app-bar .url { margin-left: 12px; font: 400 12px/1 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.app-body { display: grid; grid-template-columns: 200px 1fr; min-height: 360px; }
.side { border-right: 1px solid var(--line); padding: 18px 12px; display: grid; align-content: start; gap: 2px; font-size: 14px; color: var(--muted); }
.main { padding: 22px; display: grid; gap: 18px; min-width: 0; }
.main-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.main-head h3 { font-size: 16px; }
.chip { font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-width: 0; }
.kpi .v { font: 500 24px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 13px; color: var(--ok); margin-left: 4px; }
.kpi .k { font-size: 12px; color: var(--muted); line-height: 1.35; }
.panes { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
.pane { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.pane .t { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.sus svg { width: 100%; height: auto; display: block; }
.feed { display: grid; gap: 10px; font-size: 13px; }
.feed div { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.feed i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--accent); }
.feed i.ok { background: var(--ok); } .feed i.warn { background: var(--warn); }
.feed span { color: var(--muted); }
.feed b { color: var(--fg); font-weight: 500; }
.illus { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }
@media (max-width: 860px) {
  .app-body { grid-template-columns: 1fr; }
  .side { display: none; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .panes { grid-template-columns: 1fr; }
}

/* Logos */
.logos { padding-block: 40px; }
.logos .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 48px; }
.logos p { font-size: 13px; color: var(--muted); }
.logos .names { display: flex; flex-wrap: wrap; gap: 12px 44px; font: 400 28px/1 var(--display); color: var(--muted); }

/* Features */
.modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.module { background: var(--bg); padding: 28px; display: grid; gap: 14px; align-content: start; }
.module .step { font: 500 12px/1 var(--mono); color: var(--muted); }
.module p { color: var(--muted); font-size: 15px; }
.module ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.module li { display: flex; gap: 8px; }
.module li::before { content: "✓"; color: var(--ok); }
.integr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.integr span { font: 400 12px/1 var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; color: var(--muted); }
@media (max-width: 860px) { .modules { grid-template-columns: 1fr; } }

/* Customer stories */
.stories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.story { border: 1px solid var(--line); border-radius: 14px; padding: 26px; display: grid; gap: 14px; align-content: start; text-decoration: none; background: var(--surface); transition: border-color .15s; }
.story:hover { border-color: var(--accent); }
.story .client { font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.story .metric { font: 400 56px/1 var(--display); color: var(--accent); }
.story .metric-k { font-size: 13px; color: var(--muted); margin-top: -6px; }
.story h3 { font-size: 17px; }
.story p { font-size: 14px; color: var(--muted); }
.story .more { font-size: 14px; font-weight: 500; }
@media (max-width: 860px) { .stories { grid-template-columns: 1fr; } }

/* Benchmarks */
.bench { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 620px; }
th, td { text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .before { color: var(--muted); text-decoration: line-through; margin-right: 8px; }
td .after { color: var(--ok); }
td small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.note { margin-top: 14px; font-size: 14px; color: var(--muted); max-width: 70ch; }

/* Plans */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.plan { border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 16px; background: var(--surface); }
.plan.reco { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.plan .pname { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.plan .price { font: 400 44px/1 var(--display); }
.plan .price small { font: 400 14px/1 var(--body); color: var(--muted); margin-left: 6px; }
.plan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.plan li { display: flex; gap: 8px; }
.plan li::before { content: "→"; color: var(--accent); }
.badge { font: 500 11px/1 var(--mono); background: var(--accent); color: var(--accent-ink); padding: 5px 8px; border-radius: 999px; }
@media (max-width: 860px) { .plans { grid-template-columns: 1fr; } }

/* Changelog + status */
.two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.log { display: grid; gap: 0; border-left: 1px solid var(--line); margin-left: 6px; }
.entry { position: relative; padding: 0 0 26px 26px; display: grid; gap: 6px; }
.entry::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.entry .when { font: 500 12px/1.4 var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.entry p { font-size: 14px; color: var(--muted); max-width: 55ch; }
.status { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 24px; display: grid; gap: 18px; align-content: start; }
.status .all { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.srow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.srow span:first-child { color: var(--muted); }
.srow span:last-child { text-align: right; }

/* CTA */
.final { text-align: left; }
.final .box { border: 1px solid var(--line); border-radius: 18px; padding: clamp(28px, 6vw, 64px); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 60%); display: grid; gap: 20px; }
.final h2 { max-width: 18ch; }
.final .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
/* Prototype */
.app { position: relative; }
.app-body { position: relative; grid-template-columns: var(--sw, 232px) minmax(0, 1fr); height: min(760px, 86vh); min-height: 560px; }
.side { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.ws .av { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--ok))); color: var(--accent-ink); display: grid; place-items: center; font: 600 12px/1 var(--body); flex: none; }
.ws b { display: block; font-size: 13px; color: var(--fg); font-weight: 600; line-height: 1.2; }
.ws span { font-size: 12px; color: var(--muted); }
.side .lbl { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 14px 10px 6px; color: var(--muted); }
.side button { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 10px; border-radius: 7px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.side button svg { width: 16px; height: 16px; flex: none; }
.side button .n { margin-left: auto; font: 400 11px/1 var(--mono); }
.side button:hover { color: var(--fg); background: var(--surface-2); }
.side button[aria-current="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.side button:focus-visible { outline: 2px solid var(--accent); }
.side .avail { margin-top: auto; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; font-size: 12px; color: var(--muted); background: var(--surface); }
.side .avail b { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; font-weight: 600; }
.main { overflow-y: auto; align-content: start; grid-auto-rows: max-content; padding: 24px 28px 32px; gap: 20px; scroll-behavior: smooth; }
.banner.phones { display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 18px 18px 0; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2)); }
.banner.phones img { width: auto; height: 100%; max-width: 30%; object-fit: cover; object-position: top; border-radius: 12px 12px 0 0; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .5); }
.cover img.portrait { object-position: top; }
.main > * { animation: fadein .2s ease; }
@keyframes fadein { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.vh { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.vh h3 { font: 400 30px/1.1 var(--display); }
.vh p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { width: 220px; max-width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface-2); }
.seg button { all: unset; cursor: pointer; padding: 5px 10px; font-size: 12px; border-radius: 6px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; background: var(--surface); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 18px 40px -24px color-mix(in srgb, var(--accent) 70%, transparent); }
.card:focus-visible { outline: 2px solid var(--accent); }
.cover { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }

      <span class="eyebrow">Method</span>
      <h2>Three modules, one workflow</h2>
      <p class="lede">Each module works on its own, but they are designed to chain together: from a well-framed problem to impact measured in production.</p>
    </div>
    <div class="modules">
      <div class="module">
        <span class="step">MODULE 1 · DISCOVERY</span>
        <h3>Frame the right problem</h3>
        <p>Understand before designing.</p>
        <ul>
          <li>Qualitative interviews and surveys</li>
          <li>UX audits (Bastien &amp; Scapin, Nielsen)</li>
          <li>Design sprint workshops, How Might We</li>
          <li>Usage and data analysis</li>
        </ul>
        <div class="integr"><span>Dovetail</span><span>Notion</span><span>Miro</span><span>Maze</span></div>
      </div>
      <div class="module">
        <span class="step">MODULE 2 · DESIGN</span>
        <h3>Co-design testable solutions</h3>
        <p>Journeys you can put in front of users very early.</p>
        <ul>
          <li>User flows and happy paths</li>
          <li>Wireframes and interactive prototypes</li>
          <li>Design system and components</li>
          <li>Alignment across PM, PO, tech and business</li>
        </ul>
        <div class="integr"><span>Figma</span><span>FigJam</span><span>Storybook</span></div>
      </div>
      <div class="module">
        <span class="step">MODULE 3 · DELIVERY</span>
        <h3>Ship to production safely</h3>
        <p>Release in batches and measure impact at every step.</p>
        <ul>
          <li>User testing (SUS, think-aloud)</li>
          <li>Product and engineering handoff</li>
          <li>Release planning and roadmap prioritization</li>
          <li>Spreading a product culture</li>
        </ul>
        <div class="integr"><span>Figma</span><span>Maze</span><span>Jira</span><span>Confluence</span></div>

    </div>

    else if (LABEL[h] && h !== state.view) { state.view = h; state.id = null; render(); }
    else if (!h && state.view !== "accueil") { state.view = "accueil"; state.id = null; render(); }
  }

  // Resizable sidebar (invisible handle)
  var sw = 232;
  try { var sv = parseInt(localStorage.getItem("side-width"), 10); if (sv >= 180 && sv <= 360) sw = sv; } catch (e) {}
  bodyEl.style.setProperty("--sw", sw + "px");
  var rs = document.createElement("div");
  rs.className = "rs"; rs.tabIndex = 0;
  rs.setAttribute("role", "separator"); rs.setAttribute("aria-orientation", "vertical");
  rs.setAttribute("aria-label", "Resize navigation"); rs.setAttribute("aria-valuemin", "180"); rs.setAttribute("aria-valuemax", "360");
  bodyEl.appendChild(rs);
  function setW(w, save) {
    if (w < 120) { if (!collapsed) { collapsed = true; renderSide(); } }
    else {
      if (collapsed) { collapsed = false; renderSide(); }
      sw = Math.max(180, Math.min(360, Math.round(w)));
      bodyEl.style.setProperty("--sw", sw + "px");
    }
    rs.setAttribute("aria-valuenow", collapsed ? 60 : sw);
    if (save) { try { localStorage.setItem("side-width", String(sw)); localStorage.setItem("side-collapsed", collapsed ? "1" : "0"); } catch (e) {} }
  }
  rs.addEventListener("pointerdown", function (e) {
    e.preventDefault(); rs.setPointerCapture(e.pointerId); bodyEl.classList.add("resizing");
    var left = bodyEl.getBoundingClientRect().left;
    var startSw = sw;
    function mv(ev) { setW(ev.clientX - left, false); }
    function up() { bodyEl.classList.remove("resizing"); rs.removeEventListener("pointermove", mv); rs.removeEventListener("pointerup", up); rs.removeEventListener("pointercancel", up); if (collapsed) { sw = startSw; bodyEl.style.setProperty("--sw", sw + "px"); } setW(collapsed ? 0 : sw, true); }
    rs.addEventListener("pointermove", mv); rs.addEventListener("pointerup", up); rs.addEventListener("pointercancel", up);
  });
  rs.addEventListener("dblclick", function () { setW(232, true); });
  rs.addEventListener("keydown", function (e) {
    var step = e.shiftKey ? 40 : 16;
    if (e.key === "ArrowRight") { e.preventDefault(); setW((collapsed ? 180 - step : sw) + step, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); if (!collapsed) setW(sw - step < 180 ? 0 : sw - step, true); }
  });

  // Profile menu
  var MAILTO = "mailto:chris.depaola.toru@gmail.com?subject=" + encodeURIComponent("Book a call: Senior Product Designer role");
  var pm = document.createElement("div");
  pm.className = "pmenu"; pm.hidden = true; pm.setAttribute("role", "menu"); pm.setAttribute("aria-label", "Profile menu");
  pm.innerHTML = '<div class="pm-head"><b>Christopher De Paola</b><span>chris.depaola.toru@gmail.com</span></div>' +
    '<a role="menuitem" class="pm-item primary" href="' + MAILTO + '">' + ICON.contact + '<span>Book a call</span></a>' +
    '<button type="button" role="menuitem" class="pm-item" data-pm="copy">' + '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>' + '<span>Copy my email</span></button>' +
    '<a role="menuitem" class="pm-item" href="/assets/cv-christopher-de-paola.pdf" target="_blank" rel="noopener">' + '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg>' + '<span>Download my resume</span></a>' +
    '<button type="button" role="menuitem" class="pm-item" data-pm="apropos">' + ICON.apropos + '<span>View profile</span></button>';
  appEl.appendChild(pm);
  var pmBtn = null;
  function pmItems() { return [].slice.call(pm.querySelectorAll('[role="menuitem"]')); }
  function pmOpen(btn) {
    pmBtn = btn; pm.hidden = false; btn.setAttribute("aria-expanded", "true");
    var r = btn.getBoundingClientRect();
    if (collapsed) { pm.style.left = (r.right + 10) + "px"; pm.style.bottom = (innerHeight - r.bottom) + "px"; pm.style.width = "240px"; }
    else { pm.style.left = r.left + "px"; pm.style.bottom = (innerHeight - r.top + 8) + "px"; pm.style.width = Math.max(r.width, 230) + "px"; }
    pmItems()[0].focus();
  }
  function pmClose(refocus) {
    if (pm.hidden) return;
    pm.hidden = true;
    if (pmBtn) { pmBtn.setAttribute("aria-expanded", "false"); if (refocus) pmBtn.focus(); }
  }
  side.addEventListener("click", function (e) {
    var b = e.target.closest("[data-pmenu]"); if (!b) return;
    e.stopPropagation();
    if (pm.hidden) pmOpen(b); else pmClose(true);
  });
  pm.addEventListener("click", function (e) {
    var it = e.target.closest('[role="menuitem"]'); if (!it) return;
    if (it.dataset.pm === "copy") {
      var lab = it.querySelector("span");
      try { navigator.clipboard.writeText("chris.depaola.toru@gmail.com").then(function () { lab.textContent = "Email copied"; setTimeout(function () { lab.textContent = "Copy my email"; pmClose(true); }, 900); }, function () { pmClose(false); go("contact"); }); } catch (err) { pmClose(false); go("contact"); }
      return;
    }
    if (it.dataset.pm === "apropos") { pmClose(false); go("apropos"); return; }
    pmClose(false);
  });
  document.addEventListener("click", function (e) { if (!pm.hidden && !pm.contains(e.target)) pmClose(false); });
  document.addEventListener("keydown", function (e) {
    if (pm.hidden) return;
    var items = pmItems(), i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); pmClose(true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === "Tab") pmClose(false);
  });
  window.addEventListener("resize", function () { pmClose(false); });

  // Theme toggle + language switch
  var SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
  var MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg>';
  var DARKQ = window.matchMedia("(prefers-color-scheme: dark)");
  var themeBtn = document.querySelector("[data-theme-toggle]");
  function curTheme() { var t = document.documentElement.dataset.theme; return t === "light" || t === "dark" ? t : (DARKQ.matches ? "dark" : "light"); }
  function paintTheme() {
    var dark = curTheme() === "dark";
    themeBtn.innerHTML = dark ? SUN : MOON;
    var label = dark ? TXT.toLight : TXT.toDark;
    themeBtn.setAttribute("aria-label", label); themeBtn.title = label;
  }
  themeBtn.addEventListener("click", function () {
    var next = curTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintTheme();
  });
  if (DARKQ.addEventListener) DARKQ.addEventListener("change", paintTheme);
  paintTheme();
  var langLink = document.querySelector("[data-lang]");
  langLink.addEventListener("click", function (e) { e.preventDefault(); location.href = langLink.getAttribute("href") + location.hash; });
  window.addEventListener("hashchange", fromHash);
  render();
  fromHash();
})();
</script>
<script src="/assets/js/saas-extras.js"></script>
